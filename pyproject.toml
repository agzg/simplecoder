[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simplecoder*"]

[project]
name = "simplecoder"
version = "0.1.0"
dependencies = [
    "litellm>=1.0.0",
    "click>=8.0.0",
    "numpy>=1.20.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]
requires-python = ">=3.12"

[project.scripts]
simplecoder = "simplecoder.main:main"
